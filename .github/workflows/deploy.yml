name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button in GitHub Actions tab

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      # ponytail: no lint step — .eslintrc.json is not read by ESLint 9; add `pnpm lint` after migrating to eslint.config.mjs

  deploy:
    name: Deploy to production
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, build and restart on server
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "BLOG_KEY='${{ secrets.BLOG_DRAFT_API_KEY }}' bash -l -s" <<'EOF'
          set -e
          # Load nvm if node/pnpm/pm2 were installed through it
          [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"
          cd /var/www/ric-gateway
          # Keep the scheduled blog writer's draft-only key in .env.local (Next.js loads it in production)
          if [ -n "$BLOG_KEY" ]; then
            touch .env.local
            sed -i '/^BLOG_DRAFT_API_KEY=/d' .env.local
            echo "BLOG_DRAFT_API_KEY=$BLOG_KEY" >> .env.local
          fi
          # Update the code first so deploy.sh below is the latest version
          git fetch origin main
          # Old untracked lockfile (was gitignored) would block checkout of the committed one
          git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1 || rm -f pnpm-lock.yaml
          git reset --hard origin/main
          bash deploy.sh
          EOF
